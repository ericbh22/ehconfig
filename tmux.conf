# Basic quality of life
set -g mouse on
set -g status on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Easier reload
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Sesh picker inside tmux
# Press prefix + K to choose/create/switch sessions
bind-key K display-popup -E -w 80% -h 70% "sesh connect \"$(
  sesh list | fzf --height 100% --border --prompt='sesh > '
)\""

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum: auto-restore when tmux server starts
set -g @continuum-restore 'on'

# Optional: save pane text too
set -g @resurrect-capture-pane-contents 'on'

# Keep this at the very bottom
if-shell 'test -f "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
